services:
  - type: web
    name: agriconnect-integration-adapter
    runtime: python
    rootDir: render_service
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PROVIDER_WEBHOOK_SECRET
        sync: false
