name: AGRIC AI checks

on:
  push:
    branches:
      - feat/local-ai-assistant
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  assistant-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test
